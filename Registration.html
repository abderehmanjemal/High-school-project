  <script type="text/javascript">
    function Password1(){
	var x = document.getElementById("pass");
	var y = document.getElementById("togglepass1");
	
	
	if(x.type =="password"){
	  x.type ="text"
	  y.value ="Hide Password";
	
	}else{
	  x.type ="password";
	  y.value ="Show Password";
	}
	}
    
	function Password2(){
	var x = document.getElementById("confirm pass");
	var y = document.getElementById("togglepass2");
	
	
	if(x.type =="password"){
	  x.type ="text"
	  y.value ="Hide Password";
	
	}else{
	  x.type ="password";
	  y.value ="Show Password";
	}
	} 
  
    function Validate(){
    var password = document.getElementById("pass").value;
    var confirmPassword = document.getElementById("confirm pass").value;
	
	
    if (password != confirmPassword){
      alert("Passwords do not match.");
      return false;
      }
	  
      }

    function lettersOnly(input){
	var regex = /[^a-z]/gi;
	input.value = input.value.replace(regex,"");
	
	}
	
	function numbersOnly(input){
	var regex = /[^0-9]/g;
	input.value = input.value.replace(regex,"");
	
	}

  </script>
